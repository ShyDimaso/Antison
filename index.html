<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#000000"/>
<title>Антисон</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
  html,body{height:100%;background:#000;color:#f0f4f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;}
  #app{height:100%;}
  button{font-family:inherit;cursor:pointer;}
  input[type=range]{width:100%;height:34px;}
  .big{font-size:20px;font-weight:800;letter-spacing:1px;}
  .mono{font-family:'Courier New',monospace;}

<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useRef,useEffect}=React;
const VER="v22";

/* ============================================================
   АНТИСОН — автономный детектор засыпания.
   Без интернета, без ИИ, без навигации. Локально на телефоне.
   Камера следит за яркой меткой на руле (скотч/пластырь/рука).
   Метка замерла -> мягкая эскалация -> тревога.
   Гироскоп ловит резкий увод из полосы (отдельный сигнал).
   ============================================================ */

// звук через WebAudio (без файлов)
let AC=null;
function beep(freq,ms,vol){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type="sine";o.frequency.value=freq;
    g.gain.value=vol==null?0.3:vol;
    o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+ms/1000);
  }catch(e){}
}
function siren(times,vol){
  let i=0;const id=setInterval(()=>{beep(i%2?1200:800,220,vol==null?0.6:vol);i++;if(i>=times*2)clearInterval(id);},260);
}

/* ============================================================
   ANTISON — ТЕСТ ПОЛОСЫ (Lane Departure)
   Задняя камера смотрит вперёд на дорогу. Ищем светлые линии
   разметки на тёмном асфальте (как метка на руле — контраст).
   Ловим увод машины из полосы. Микрофон слушает щелчки поворотника.
   Лог пишется сам. Эфир/интернет не нужен.
   ============================================================ */
/* ============================================================
   ANTISON — ТЕСТ ПОЛОСЫ v7
   Авто-зона: нижняя треть кадра (дорога перед капотом).
   Детектор ЛИНИЙ (не пятен): ищем столбцы, где есть узкая
   вертикальная светлая черта (разметка), а не просто светлое.
   Калибровка: жмёшь "на линии слева/справа" когда наехал колесом —
   приложение запоминает, где для тебя граница полосы.
   Микрофон слушает поворотник. Лог сам. Без интернета.
   ============================================================ */
/* ============================================================
   ANTISON — ТЕСТ ПОЛОСЫ v8
   Детектор по КРАЯМ (принцип Canny), а не по яркости.
   Разметка = перепад яркости: асфальт→светлое (левый край линии)
   и светлое→асфальт (правый край) на ширине ~линии. Ловит даже
   тусклую разметку, т.к. важен ПЕРЕПАД, не абсолютная яркость.
   Кадр сглаживаем (меньше шума). Оставляем только то, что
   вертикально выстраивается в прямую = линия, а не блик.
   Авто-зона: нижняя треть. Меню сверху (телефон стоит низко).
   Калибровка кнопками "на линии". Микрофон = поворотник. Лог сам.
   ============================================================ */
/* ============================================================
   ANTISON — ТЕСТ ПОЛОСЫ v10
   Детектор краёв (Canny-принцип) — из v9, работает.
   АВТОКАЛИБРОВКА по голосу: едь ровно -> прижмись влево ->
   вправо -> в середину -> контроль включён. Голос ведёт,
   руки на руле. На повороте калибровка ждёт. Поворотник убран.
   ============================================================ */
/* ============================================================
   ANTISON — ТЕСТ ПОЛОСЫ v11
   Калибровка РЕАГИРУЕТ на водителя (ждёт реального прижатия и
   держит N секунд, не проскакивает по таймеру). Голос сразу.
   Порядок: центр -> левое зеркало прижмись -> центр -> правое
   зеркало прижмись -> центр -> "нажмите Старт". Кнопки сверху.
   Детектор краёв — из v9/10.
   ============================================================ */
/* ============================================================
   ANTISON — ТЕСТ ПОЛОСЫ v15
   ЧЕСТНАЯ калибровка, ровно по проездам водителя:
   - едешь ПО ЦЕНТРУ 20 сек -> усредняю позицию центра полосы
   - встал к ЛЕВОЙ 20 сек -> усредняю (это левый край коридора)
   - встал к ПРАВОЙ 20 сек -> усредняю (правый край)
   Коридор = ровно между этими замерами. Никаких выдуманных порогов.
   Касание края -> короткий мягкий сигнал 1 сек. Тревога гаснет.
   Всё меряется по центру полосы mid=(левая+правая)/2.
   ============================================================ */
/* ============================================================
   ANTISON — ТЕСТ ПОЛОСЫ v16
   ДВЕ НЕЗАВИСИМЫЕ ЛИНИИ. Обе одинаково важны (слева встречка,
   справа съезд/пропасть). За каждой следим отдельно.
   Калибровка (каждый замер 20 сек, усредняем):
     1) центр  -> где левая (cLc) и правая (cRc) при езде по центру
     2) к левой -> куда левая доходит когда прижат (cLlim)
     3) к правой-> куда правая доходит когда прижат (cRlim)
   Контроль: левая линия дошла до своего предела ИЛИ правая до
   своего -> сигнал. Линия пропала (съезд/гармошка) -> по той
   стороне молчим, держим последнее положение пару кадров.
   Сигнал только при РЕАЛЬНОМ наезде (не приближении).
   ============================================================ */
function LaneTest({vol,setScreen}){
  const [phase,setPhase]=React.useState("init");
  const [err,setErr]=React.useState("");
  const [leftX,setLeftX]=React.useState(null);
  const [rightX,setRightX]=React.useState(null);
  const [alarm,setAlarm]=React.useState(false);
  const [alarmSide,setAlarmSide]=React.useState("");
  const [recN,setRecN]=React.useState(0);
  const [spd,setSpd]=React.useState(null);
  const [clock,setClock]=React.useState("");
  const [calStep,setCalStep]=React.useState(0); // 0 покой,1 центр,2 левая,3 правая,4 ждём старт,5 контроль
  const [secLeft,setSecLeft]=React.useState(0);
  const [cdShow,setCdShow]=React.useState(0);
  const [measuring,setMeasuring]=React.useState(false);
  const [shotsN,setShotsN]=React.useState(0);
  const [msg,setMsg]=React.useState("Выедь на прямой участок и нажми «Калибровка»");

  const videoRef=React.useRef(null),rawRef=React.useRef(null),viewRef=React.useRef(null);
  const streamRef=React.useRef(null),rafRef=React.useRef(0);
  const logRef=React.useRef([]),startTsRef=React.useRef(Date.now());
  const alarmRef=React.useRef(false);
  const leftXRef=React.useRef(null),rightXRef=React.useRef(null);
  const lMissRef=React.useRef(0),rMissRef=React.useRef(0);
  // калибровка: центр каждой линии + предел каждой
  const cLc=React.useRef(null),cRc=React.useRef(null);     // центр: левая, правая
  const cLlim=React.useRef(null),cRlim=React.useRef(null); // предел: левая (прижат влево), правая (прижат вправо)
  const calStepRef=React.useRef(0);
  const stepEndRef=React.useRef(0);
  const bufL=React.useRef([]),bufR=React.useRef([]);
  const spokeRef=React.useRef(-1);
  const cdRef=React.useRef(0),cdNextRef=React.useRef(0);
  const measuringRef=React.useRef(false);
  const onLineMsRef=React.useRef(0);
  const shotsRef=React.useRef([]);      // снимки: {code,dataUrl}
  const shotWantRef=React.useRef(null); // какой снимок сделать на след. кадре
  const AW=96,AH=72;
  const Z_FAR=Math.floor(AH*0.50);   // дальняя часть: смотрим для подтверждения линии
  const Z_NEAR=Math.floor(AH*0.65);  // БЛИЖНЯЯ у капота: по ней меряем съезд с полосы
  const Z0=Z_FAR;
  const MEASURE_MS=20000;
  const HOLD_LOST=10; // сколько кадров держим пропавшую линию

  const say=(t)=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";u.rate=1.0;speechSynthesis.speak(u);}catch(e){}};
  const warm=()=>{try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){}};
  // сказать и ТОЛЬКО ПОТОМ выполнить действие (чтобы отсчёт не начинался поверх речи)
  const sayThen=(t,cb)=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";u.rate=1.0;u.onend=()=>{try{cb&&cb();}catch(e){}};u.onerror=()=>{try{cb&&cb();}catch(e){}};speechSynthesis.speak(u);setTimeout(()=>{if(cdRef.current===0&&!measuringRef.current){try{cb&&cb();}catch(e){}}},9000);}catch(e){try{cb&&cb();}catch(e2){}}};

  React.useEffect(()=>{const id=setInterval(()=>setClock(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})),1000);return()=>clearInterval(id);},[]);
  React.useEffect(()=>{
    let wid=null;
    try{ if(navigator.geolocation){ wid=navigator.geolocation.watchPosition(pos=>{ if(pos.coords.speed!=null&&pos.coords.speed>=0) setSpd(Math.round(pos.coords.speed*2.23694)); },()=>{},{enableHighAccuracy:true,maximumAge:1000}); } }catch(e){}
    return()=>{try{if(wid!=null)navigator.geolocation.clearWatch(wid);}catch(e){}};
  },[]);

  const startCam=async()=>{
    setErr("");
    try{
      const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:480},height:{ideal:360}},audio:false});
      streamRef.current=s;
      if(videoRef.current){videoRef.current.srcObject=s;await videoRef.current.play().catch(()=>{});}
      setPhase("live");startTsRef.current=Date.now();warm();loop();
    }catch(e){setErr((e&&e.name?e.name+": ":"")+(e&&e.message||String(e)));setPhase("error");}
  };
  const stopAll=()=>{cancelAnimationFrame(rafRef.current);try{speechSynthesis.cancel();}catch(e){}if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}};
  React.useEffect(()=>{startCam();return()=>stopAll();},[]);

  const detect=(img)=>{
    const d=img.data,W=AW,H=AH;
    const gray=new Float32Array(W*H);
    for(let y=Z0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;gray[y*W+x]=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;}
    const STEP=2,EDGE=4,MAXW=10;
    const voteNear=new Float32Array(W), voteFar=new Float32Array(W);
    for(let y=Z_FAR;y<H;y++){
      const near = y>=Z_NEAR;
      for(let x=STEP;x<W-STEP-MAXW;x++){
        const g=gray[y*W+x+STEP]-gray[y*W+x-STEP];
        if(g>EDGE){ for(let w=2;w<=MAXW;w++){ const g2=gray[y*W+x+w+STEP]-gray[y*W+x+w-STEP];
          if(g2<-EDGE){ const c=x+Math.floor(w/2); if(near) voteNear[c]+=1; else voteFar[c]+=1; break; } } }
      }
    }
    const zoneH=H-Z_NEAR;const colVote=voteNear;
    const need=Math.max(2,zoneH*0.15);const sm=new Float32Array(W);
    for(let x=1;x<W-1;x++)sm[x]=colVote[x-1]*0.5+colVote[x]+colVote[x+1]*0.5;
    // собираем ВСЕ пики-линии (локальные максимумы выше порога)
    const peaks=[];
    for(let x=2;x<W-2;x++){
      if(sm[x]<need) continue;
      if(sm[x]>=sm[x-1] && sm[x]>=sm[x+1]){
        if(peaks.length && x-peaks[peaks.length-1].x<3){ if(sm[x]>peaks[peaks.length-1].s) peaks[peaks.length-1]={x:x,s:sm[x]}; }
        else peaks.push({x:x,s:sm[x]});
      }
    }
    // дальние пики — подтверждают, что это настоящая линия дороги (тянется вдаль), а не пятно
    const smF=new Float32Array(W);
    for(let x=1;x<W-1;x++) smF[x]=voteFar[x-1]*0.5+voteFar[x]+voteFar[x+1]*0.5;
    const needF=Math.max(2,(Z_NEAR-Z_FAR)*0.25);
    const farPeaks=[];
    for(let x=2;x<W-2;x++){ if(smF[x]<needF) continue; if(smF[x]>=smF[x-1]&&smF[x]>=smF[x+1]) farPeaks.push(x/W); }
    return {peaks:peaks.map(p=>({x:p.x/W,s:p.s})), farPeaks, sm, need};
  };

  const beginStep=(st)=>{calStepRef.current=st;setCalStep(st);bufL.current=[];bufR.current=[];
    cdRef.current=0;cdNextRef.current=0;setCdShow(0);measuringRef.current=false;setMeasuring(false);setSecLeft(0);spokeRef.current=-1;};
  const armCountdown=()=>{ if(measuringRef.current)return; cdRef.current=3; cdNextRef.current=Date.now(); setCdShow(3); };
  const startCalib=()=>{warm();spokeRef.current=-1;beginStep(1);};
  const cancelCalib=()=>{calStepRef.current=0;setCalStep(0);setMsg("Калибровка сброшена");say("Калибровка сброшена");};
  const pressStart=()=>{calStepRef.current=5;setCalStep(5);setMsg("✓ Контроль включён");say("Контроль полосы включён. Держись в центре. Устал — остановись и поспи.");};
  // снимок кадра с подписью-кодом (чтобы понимать, к чему относится)
  const grabShot=(code,info)=>{
    try{
      const v=videoRef.current; if(!v||v.readyState<2) return;
      const c=document.createElement("canvas"); c.width=480;c.height=360;
      const ctx=c.getContext("2d"); ctx.drawImage(v,0,0,c.width,c.height);
      // линии зон
      const yF=Z_FAR/AH*c.height, yN=Z_NEAR/AH*c.height;
      ctx.strokeStyle="rgba(74,158,255,0.8)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,yF);ctx.lineTo(c.width,yF);ctx.stroke();
      ctx.strokeStyle="rgba(0,232,122,0.95)";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,yN);ctx.lineTo(c.width,yN);ctx.stroke();
      // найденные линии
      if(leftXRef.current!=null){const px=leftXRef.current*c.width;ctx.strokeStyle="#ffd23f";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px,yF);ctx.lineTo(px,c.height);ctx.stroke();}
      if(rightXRef.current!=null){const px=rightXRef.current*c.width;ctx.strokeStyle="#ffffff";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(px,yF);ctx.lineTo(px,c.height);ctx.stroke();}
      // подпись-код
      ctx.fillStyle="rgba(0,0,0,0.75)";ctx.fillRect(0,0,c.width,44);
      ctx.fillStyle="#fff";ctx.font="bold 20px sans-serif";ctx.fillText(code,8,26);
      ctx.font="13px monospace";ctx.fillStyle="#9fcfff";ctx.fillText(info||"",8,40);
      shotsRef.current.push({code:code,dataUrl:c.toDataURL("image/jpeg",0.7)});
      setShotsN(shotsRef.current.length);
    }catch(e){}
  };
  const avg=(a)=>{const f=a.filter(x=>x!=null);return f.length?f.reduce((x,y)=>x+y,0)/f.length:null;};
  // зона, где водитель ДОЛЬШЕ ВСЕГО держался: строим гистограмму и берём её пик
  const modeZone=(a)=>{
    const f=a.filter(x=>x!=null); if(f.length<10) return null;
    const BINS=40, lo=Math.min.apply(null,f), hi=Math.max.apply(null,f);
    if(hi-lo<1e-6) return f[0];
    const h=new Array(BINS).fill(0);
    f.forEach(v=>{let i=Math.floor((v-lo)/(hi-lo)*BINS); if(i>=BINS)i=BINS-1; h[i]++;});
    let best=0,bi=0; for(let i=0;i<BINS;i++){ const s=h[i]+(h[i-1]||0)*0.5+(h[i+1]||0)*0.5; if(s>best){best=s;bi=i;} }
    // среднее значений, попавших в пиковую корзину и соседние
    const c0=lo+(bi-1)/BINS*(hi-lo), c1=lo+(bi+2)/BINS*(hi-lo);
    const sel=f.filter(v=>v>=c0&&v<=c1);
    return sel.length? sel.reduce((x,y)=>x+y,0)/sel.length : f[Math.floor(f.length/2)];
  };

  const loop=()=>{
    const v=videoRef.current,raw=rawRef.current;
    if(!v||!raw){rafRef.current=requestAnimationFrame(loop);return;}
    const now=Date.now();
    if(v.readyState>=2){
      const rc=raw.getContext("2d",{willReadFrequently:true});
      rc.drawImage(v,0,0,AW,AH);
      let img=null;try{img=rc.getImageData(0,0,AW,AH);}catch(e){}
      let res={peaks:[],sm:null,need:0};
      if(img)res=detect(img);
      const peaks=res.peaks||[];
      // ВЫБОР МОИХ ЛИНИЙ: держимся за ту же линию, что вели раньше (ближайший пик к прошлой позиции),
      // а не "что левее/правее середины экрана". Так столбики и дальние полосы не собьют.
      const pickNear=(prev,exclude)=>{
        if(!peaks.length) return null;
        let best=null,bd=1e9;
        for(const p of peaks){
          if(exclude!=null && Math.abs(p.x-exclude)<0.03) continue;
          const d=prev==null? 1e8-p.s : Math.abs(p.x-prev);
          if(prev!=null && d>0.12) continue; // слишком далеко — это другая линия
          if(d<bd){bd=d;best=p.x;}
        }
        return best;
      };
      let newL=null,newR=null;
      const prevL=leftXRef.current, prevR=rightXRef.current;
      if(prevL!=null||prevR!=null){
        newL=pickNear(prevL,null);
        newR=pickNear(prevR,newL);
      } else {
        // первый кадр / после сброса: берём две самые сильные линии, левее и правее
        const sorted=peaks.slice().sort((a,b)=>b.s-a.s).slice(0,4).sort((a,b)=>a.x-b.x);
        if(sorted.length>=2){ newL=sorted[0].x; newR=sorted[sorted.length-1].x; }
        else if(sorted.length===1){ if(sorted[0].x<0.5) newL=sorted[0].x; else newR=sorted[0].x; }
      }
      if(newL!=null){leftXRef.current=prevL==null?newL:prevL*0.7+newL*0.3;lMissRef.current=0;}
      else{lMissRef.current++;if(lMissRef.current>HOLD_LOST)leftXRef.current=null;}
      if(newR!=null){rightXRef.current=prevR==null?newR:prevR*0.7+newR*0.3;rMissRef.current=0;}
      else{rMissRef.current++;if(rMissRef.current>HOLD_LOST)rightXRef.current=null;}
      setLeftX(leftXRef.current);setRightX(rightXRef.current);
      const lX=leftXRef.current,rX=rightXRef.current;
      const step=calStepRef.current;

      if(step!==spokeRef.current && step>=1 && step<=4){
        spokeRef.current=step;
        if(step===1){ sayThen("Едь ровно по центру полосы. Как будешь готов — я начну отсчёт.",()=>armCountdown()); }
        if(step===2){ sayThen("Теперь прижмись к левой линии. Смотри в левое зеркало, подойди максимально близко. Как доедешь — я начну отсчёт.",()=>armCountdown()); }
        if(step===3){ sayThen("Теперь прижмись к правой линии. Смотри в правое зеркало. Как доедешь — я начну отсчёт.",()=>armCountdown()); }
        if(step===4) say("Готово. Обе линии записаны. Нажми Старт, чтобы включить контроль.");
      }

      // обратный отсчёт 3-2-1 перед замером
      if(cdRef.current>0){
        if(now>=cdNextRef.current){
          const n=cdRef.current;
          if(n>0){ say(String(n)); beep(700,120,vol*0.4); }
          cdRef.current=n-1; cdNextRef.current=now+1000;
          setCdShow(cdRef.current);
          if(cdRef.current===0){ say("Замер пошёл. Держись."); stepEndRef.current=Date.now()+1000+MEASURE_MS; bufL.current=[];bufR.current=[]; measuringRef.current=true; setMeasuring(true); }
        }
      }

      // ЗАМЕРЫ (только после отсчёта)
      if(step>=1 && step<=3 && measuringRef.current){
        if(lX!=null) bufL.current.push(lX);
        if(rX!=null) bufR.current.push(rX);
        const remain=Math.max(0,stepEndRef.current-now); setSecLeft(Math.ceil(remain/1000));
        if(remain<=0){
          measuringRef.current=false; setMeasuring(false);
          const nL=bufL.current.length, nR=bufR.current.length;
          const MIN=40; // минимум кадров с линией, иначе замер не годится
          // ЗАПИСЫВАЕМ ТО, ЧТО ПРОЕХАЛ. С первого раза.
          if(step===1){
            cLc.current=modeZone(bufL.current); cRc.current=modeZone(bufR.current);
            grabShot("1-CENTER (езда по центру)","L="+(cLc.current!=null?cLc.current.toFixed(3):"нет")+" R="+(cRc.current!=null?cRc.current.toFixed(3):"нет")+" кадров L:"+nL+" R:"+nR);
            say("Центр записан. Отбой."); beginStep(2);
          }
          else if(step===2){
            const val=modeZone(bufL.current);
            cLlim.current=(val!=null?val:cLc.current);
            grabShot("2-LEFT (прижат к левой)","Llim="+(cLlim.current!=null?cLlim.current.toFixed(3):"нет")+" (центр был "+(cLc.current!=null?cLc.current.toFixed(3):"?")+") кадров L:"+nL);
            say("Левый край записан. Отбой."); beginStep(3);
          }
          else if(step===3){
            const val=modeZone(bufR.current);
            cRlim.current=(val!=null?val:cRc.current);
            grabShot("3-RIGHT (прижат к правой)","Rlim="+(cRlim.current!=null?cRlim.current.toFixed(3):"нет")+" (центр был "+(cRc.current!=null?cRc.current.toFixed(3):"?")+") кадров R:"+nR);
            say("Правый край записан. Отбой."); calStepRef.current=4;setCalStep(4);
          }
        }
      }

      const ph = measuringRef.current ? ("ЗАМЕР · "+secLeft+" сек") : (cdRef.current>0? ("готовься: "+cdRef.current) : "доезжай до линии…");
      if(step===1) setMsg("Едь ПО ЦЕНТРУ · "+ph+" · L:"+bufL.current.length+" R:"+bufR.current.length);
      else if(step===2) setMsg("← ЛЕВАЯ линия (зеркало) · "+ph+" · L:"+bufL.current.length);
      else if(step===3) setMsg("ПРАВАЯ линия (зеркало) → · "+ph+" · R:"+bufR.current.length);
      else if(step===4) setMsg("✓ Калибровка готова. Нажми СТАРТ.");

      // ---- КОНТРОЛЬ: две независимые линии ----
      let stage=0,sideTxt="";
      if(step===5){
        // ЛЕВАЯ: от центра cLc линия при прижатии идёт к cLlim. наехал = дошёл до cLlim (с запасом внутрь)
        if(lX!=null && cLc.current!=null && cLlim.current!=null){
          const dir=Math.sign(cLlim.current-cLc.current)||1; // куда движется левая при прижатии
          const reach=cLlim.current - dir*Math.abs(cLlim.current-cLc.current)*0.10; // порог у самого предела
          if(dir>0 ? lX>=reach : lX<=reach){ stage=2; sideTxt="ЛЕВАЯ"; }
        }
        // ПРАВАЯ независимо
        if(rX!=null && cRc.current!=null && cRlim.current!=null){
          const dir=Math.sign(cRlim.current-cRc.current)||1;
          const reach=cRlim.current - dir*Math.abs(cRlim.current-cRc.current)*0.10;
          if(dir>0 ? rX>=reach : rX<=reach){ stage=2; sideTxt=sideTxt?"ОБЕ":"ПРАВАЯ"; }
        }
      }
      // сигнал только если реально ЗАШЁЛ на линию и держится ~0.5 сек (убирает писки от дрожания)
      if(stage>=2) onLineMsRef.current+=90; else onLineMsRef.current=0;
      const confirmed = onLineMsRef.current>=500;
      if(confirmed && !alarmRef.current){ alarmRef.current=true; setAlarm(true); setAlarmSide(sideTxt); beep(780,850,vol*0.45); setTimeout(()=>{alarmRef.current&&setAlarm(false);},950);
        if(shotsRef.current.length<12 && now-(shotWantRef.current||0)>5000){ shotWantRef.current=now;
          grabShot("4-ALARM "+sideTxt,"lX="+(lX!=null?lX.toFixed(3):"нет")+" rX="+(rX!=null?rX.toFixed(3):"нет")+" | Llim="+(cLlim.current!=null?cLlim.current.toFixed(3):"?")+" Rlim="+(cRlim.current!=null?cRlim.current.toFixed(3):"?")); } }
      else if(!confirmed && alarmRef.current){ alarmRef.current=false; setAlarm(false); }

      // HUD
      const view=viewRef.current;
      if(view){
        const vc=view.getContext("2d"),VW=view.width,VH=view.height;
        vc.drawImage(v,0,0,VW,VH);
        const zy=Z_FAR/AH*VH, zyN=Z_NEAR/AH*VH;
        vc.strokeStyle="rgba(74,158,255,0.35)";vc.lineWidth=1;vc.beginPath();vc.moveTo(0,zy);vc.lineTo(VW,zy);vc.stroke();
        vc.strokeStyle="rgba(0,232,122,0.85)";vc.lineWidth=2;vc.beginPath();vc.moveTo(0,zyN);vc.lineTo(VW,zyN);vc.stroke();
        vc.fillStyle="rgba(0,232,122,0.9)";vc.font="bold 11px sans-serif";vc.fillText("контроль здесь ↓",6,zyN-5);
        if(res.sm){const sx=VW/AW;for(let x=0;x<AW;x++){if(res.sm[x]>=res.need){vc.fillStyle="rgba(0,232,255,0.4)";vc.fillRect(x*sx,zy,sx,VH-zy);}}}
        if(lX!=null){const px=lX*VW;vc.strokeStyle="#ffd23f";vc.lineWidth=4;vc.beginPath();vc.moveTo(px,zy);vc.lineTo(px,VH);vc.stroke();}
        if(rX!=null){const px=rX*VW;vc.strokeStyle="#fff";vc.lineWidth=4;vc.beginPath();vc.moveTo(px,zy);vc.lineTo(px,VH);vc.stroke();}
        // пределы (красные) — левый и правый
        if(cLlim.current!=null){const px=cLlim.current*VW;vc.strokeStyle="rgba(255,80,80,0.85)";vc.setLineDash([5,4]);vc.lineWidth=2;vc.beginPath();vc.moveTo(px,zy);vc.lineTo(px,VH);vc.stroke();vc.setLineDash([]);}
        if(cRlim.current!=null){const px=cRlim.current*VW;vc.strokeStyle="rgba(255,80,80,0.85)";vc.setLineDash([5,4]);vc.lineWidth=2;vc.beginPath();vc.moveTo(px,zy);vc.lineTo(px,VH);vc.stroke();vc.setLineDash([]);}
      }

      logRef.current.push({t:now-startTsRef.current,lX:lX!=null?+lX.toFixed(3):null,rX:rX!=null?+rX.toFixed(3):null,step,cLc:cLc.current,cRc:cRc.current,cLlim:cLlim.current,cRlim:cRlim.current,stage,side:sideTxt});
      setRecN(logRef.current.length);
    }
    rafRef.current=requestAnimationFrame(()=>setTimeout(loop,90));
  };

  const downloadShots=()=>{
    shotsRef.current.forEach((s,i)=>{
      setTimeout(()=>{
        const a=document.createElement("a"); a.href=s.dataUrl;
        a.download="antison_shot_"+String(i+1).padStart(2,"0")+"_"+s.code.replace(/[^a-zA-Z0-9-]/g,"_")+".jpg";
        document.body.appendChild(a);a.click();setTimeout(()=>document.body.removeChild(a),300);
      }, i*500);
    });
  };
  const download=()=>{
    const out={meta:{app:"Antison-LaneTest",ver:VER,ts:new Date().toISOString(),ua:navigator.userAgent,cLc:cLc.current,cRc:cRc.current,cLlim:cLlim.current,cRlim:cRlim.current,samples:logRef.current.length},rows:logRef.current};
    const blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="antison_lane_"+new Date().toISOString().replace(/[:.]/g,"-")+".json";
    document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);
  };

  if(phase==="error") return (
    <div style={{height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",textAlign:"center"}}>
      <video ref={videoRef} playsInline muted autoPlay style={{display:"none"}}/>
      <div style={{color:"#ff6666",fontSize:"15px",marginBottom:"10px"}}>Камера не открылась</div>
      <div className="mono" style={{fontSize:"12px",color:"#8a9bb0",marginBottom:"16px"}}>{err}</div>
      <button onClick={()=>{stopAll();setScreen("home");}} style={{padding:"12px 20px",borderRadius:"12px",border:"1px solid #4a9eff",background:"rgba(74,158,255,0.12)",color:"#9fcfff"}}>Назад</button>
    </div>
  );

  const stepColor=calStep>=4?"#00e87a":calStep>0?"#ffd23f":"#8a9bb0";

  return (
   <React.Fragment>
    <video ref={videoRef} playsInline muted autoPlay style={{display:"none"}}/>
    <canvas ref={rawRef} width={AW} height={AH} style={{display:"none"}}/>

    <div style={{height:"100%",position:"relative",background:"#000",overflow:"hidden",display:"flex",flexDirection:"column"}}>
      <div style={{padding:"8px 12px 8px",background:"rgba(10,13,20,0.97)",borderBottom:"1px solid rgba(74,158,255,0.25)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <span className="mono" style={{fontSize:"19px",fontWeight:900,color:"#fff"}}>ПОЛОСА {VER}</span>
            <span style={{fontSize:"15px",fontWeight:900,marginLeft:"10px",padding:"3px 8px",borderRadius:"7px",background:leftX!=null?"rgba(255,210,63,0.25)":"rgba(90,90,90,0.2)",color:leftX!=null?"#ffd23f":"#667"}}>{leftX!=null?"◀ ЛЕВУЮ ВИЖУ":"◀ нет"}</span>
            <span style={{fontSize:"15px",fontWeight:900,marginLeft:"6px",padding:"3px 8px",borderRadius:"7px",background:rightX!=null?"rgba(255,255,255,0.22)":"rgba(90,90,90,0.2)",color:rightX!=null?"#fff":"#667"}}>{rightX!=null?"ПРАВУЮ ВИЖУ ▶":"нет ▶"}</span>
          </div>
          <div className="mono" style={{fontSize:"15px",fontWeight:800,color:"#f0f4f8"}}>{spd!=null?spd:"--"} mph · {clock}</div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"10px",marginTop:"5px"}}>
          {calStep>=1&&calStep<=3&&(
            <div className="mono" style={{fontSize:"38px",fontWeight:900,color:measuring?"#00e87a":(cdShow>0?"#ff6b35":"#556"),lineHeight:1,minWidth:"64px",textAlign:"center"}}>{measuring?secLeft:(cdShow>0?cdShow:"·")}</div>
          )}
          <div style={{fontSize:"15px",fontWeight:800,color:stepColor,lineHeight:1.3,minHeight:"22px",flex:1}}>{msg}</div>
        </div>

        <div style={{marginTop:"8px"}}>
          {calStep===0&&(
            <button onClick={startCalib} style={{width:"100%",padding:"15px",borderRadius:"12px",fontSize:"17px",fontWeight:800,border:"1px solid #4a9eff",background:"linear-gradient(135deg,#0d233a,#163558)",color:"#9fcfff"}}>🎯 КАЛИБРОВКА (голосом)</button>
          )}
          {calStep>=1&&calStep<=3&&(
            <button onClick={cancelCalib} style={{width:"100%",padding:"12px",borderRadius:"11px",fontSize:"14px",fontWeight:700,border:"1px solid rgba(255,210,63,0.5)",background:"rgba(255,210,63,0.12)",color:"#ffd23f"}}>↺ Отменить калибровку</button>
          )}
          {calStep===4&&(
            <button onClick={pressStart} style={{width:"100%",padding:"16px",borderRadius:"12px",fontSize:"18px",fontWeight:900,border:"1px solid #00e87a",background:"linear-gradient(135deg,#0f401b,#1c6e32)",color:"#8cffbe"}}>▶ СТАРТ — включить контроль</button>
          )}
          {calStep===5&&(
            <button onClick={()=>{calStepRef.current=0;setCalStep(0);cLc.current=cRc.current=cLlim.current=cRlim.current=null;setMsg("Нажми «Калибровка»");}} style={{width:"100%",padding:"12px",borderRadius:"11px",fontSize:"14px",fontWeight:700,border:"1px solid rgba(255,210,63,0.5)",background:"rgba(255,210,63,0.12)",color:"#ffd23f"}}>↺ Перекалибровать</button>
          )}
          <div style={{display:"flex",gap:"8px",marginTop:"8px"}}>
            <button onClick={download} style={{flex:1,padding:"12px",borderRadius:"11px",fontSize:"13px",fontWeight:700,border:"1px solid rgba(255,255,255,0.2)",background:"rgba(20,24,34,0.9)",color:"#c0c8d4"}}>⬇ Лог:{recN}</button>
            <button onClick={downloadShots} style={{flex:1,padding:"12px",borderRadius:"11px",fontSize:"13px",fontWeight:700,border:"1px solid #4a9eff",background:"rgba(74,158,255,0.15)",color:"#9fcfff"}}>📷 Фото:{shotsN}</button>
            <button onClick={()=>{stopAll();setScreen("home");}} style={{flex:1.3,padding:"12px",borderRadius:"11px",fontSize:"16px",fontWeight:800,border:"1px solid #ff4444",background:"rgba(255,68,68,0.18)",color:"#ff8888"}}>■ СТОП</button>
          </div>
        </div>
      </div>

      <div style={{flex:1,position:"relative",padding:"8px",display:"flex",alignItems:"center",justifyContent:"center"}}>
        <canvas ref={viewRef} width={320} height={240} style={{width:"100%",aspectRatio:"4 / 3",borderRadius:"12px",border:"1px solid rgba(74,158,255,0.3)",display:"block",background:"#000"}}/>
        {alarm&&<div style={{position:"absolute",background:"rgba(160,40,0,0.85)",color:"#fff",fontSize:"24px",fontWeight:900,padding:"12px 20px",borderRadius:"14px"}}>⚠ {alarmSide} ЛИНИЯ</div>}
      </div>
    </div>
   </React.Fragment>
  );
}

function App(){
  const [screen,setScreen]=useState("home"); // home|settings|run
  // ---- настройки (localStorage) ----
  const load=(k,d)=>{try{const v=localStorage.getItem("as_"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
  const [glowColor,setGlowColor]=useState(load("glowColor","amber")); // amber|white|green
  const [glowMax,setGlowMax]=useState(load("glowMax",0.6));
  const [autoGlow,setAutoGlow]=useState(load("autoGlow",true));
  const [holdSec,setHoldSec]=useState(load("holdSec",3));      // сек без движения -> писк
  const [sens,setSens]=useState(load("sens",1.0));
  const [gyroOn,setGyroOn]=useState(load("gyroOn",true));
  const [checkOn,setCheckOn]=useState(load("checkOn",true));   // кнопка бдительности
  const [checkSec,setCheckSec]=useState(load("checkSec",45));  // интервал чека
  const [vol,setVol]=useState(load("vol",0.6));
  const [showCam,setShowCam]=useState(load("showCam",true));   // показывать видео (тест) / прятать
  useEffect(()=>{const s={glowColor,glowMax,autoGlow,holdSec,sens,gyroOn,checkOn,checkSec,vol,showCam};for(const k in s){try{localStorage.setItem("as_"+k,JSON.stringify(s[k]));}catch(e){}}},[glowColor,glowMax,autoGlow,holdSec,sens,gyroOn,checkOn,checkSec,vol,showCam]);

  return (
    <div style={{height:"100%",background:"#000"}}>
      {screen==="home"&&<Home setScreen={setScreen}/>}
      {screen==="settings"&&<Settings {...{glowColor,setGlowColor,glowMax,setGlowMax,autoGlow,setAutoGlow,holdSec,setHoldSec,sens,setSens,gyroOn,setGyroOn,checkOn,setCheckOn,checkSec,setCheckSec,vol,setVol,showCam,setShowCam,setScreen}}/>}
      {screen==="run"&&<Run {...{glowColor,setGlowColor,glowMax,setGlowMax,autoGlow,setAutoGlow,holdSec,setHoldSec,sens,setSens,gyroOn,setGyroOn,checkOn,setCheckOn,checkSec,setCheckSec,vol,setVol,showCam,setShowCam,setScreen}}/>}
      {screen==="lane"&&<LaneTest vol={vol} setScreen={setScreen}/>}
    </div>
  );
}

}

function glowRGB(c){ return c==="white"?"255,255,255":c==="green"?"160,255,120":"255,190,110"; }

function Run(p){
  const [phase,setPhase]=useState("init"); // init|setzone|live|error
  const [err,setErr]=useState("");
  const [showSet,setShowSet]=useState(false);
  const [hud,setHud]=useState(p.showCam);
  const [seeMark,setSeeMark]=useState(false);
  const [alarm,setAlarm]=useState(false);
  const [checkNow,setCheckNow]=useState(false);
  const [autoThr,setAutoThr]=useState(150);
  const [glowNow,setGlowNow]=useState(p.glowMax);
  const [spd,setSpd]=useState(null);
  const [clock,setClock]=useState("");
  const [recN,setRecN]=useState(0);
  const [zone,setZone]=useState(null); // {x0,y0,x1,y1} в долях 0..1
  const [drawing,setDrawing]=useState(null);

  const videoRef=useRef(null),rawRef=useRef(null),viewRef=useRef(null),setupRef=useRef(null),streamRef=useRef(null),rafRef=useRef(0);
  const lastXRef=useRef(null),stillMsRef=useRef(0),lastTsRef=useRef(0);
  const thrRef=useRef(150),glowRef=useRef(p.glowMax),autoGlowRef=useRef(p.autoGlow),zoneRef=useRef(null);
  const stageRef=useRef(0);
  const logRef=useRef([]),recRef=useRef(true);
  const checkTimerRef=useRef(0),checkArmedRef=useRef(false),checkDeadlineRef=useRef(0);
  const AW=64,AH=48;

  useEffect(()=>{const id=setInterval(()=>{setClock(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}));},1000);return()=>clearInterval(id);},[]);

  useEffect(()=>{
    let wid=null;
    try{ if(navigator.geolocation){ wid=navigator.geolocation.watchPosition(pos=>{ if(pos.coords.speed!=null&&pos.coords.speed>=0) setSpd(Math.round(pos.coords.speed*2.23694)); },()=>{},{enableHighAccuracy:true,maximumAge:1000}); } }catch(e){}
    return()=>{try{if(wid!=null)navigator.geolocation.clearWatch(wid);}catch(e){}};
  },[]);

  useEffect(()=>{
    if(!p.gyroOn)return;
    const onMot=(e)=>{ const r=e.rotationRate||{}; const yaw=Math.abs(r.alpha||0);
      if(yaw>90){ if(recRef.current)logRef.current.push({t:Date.now(),ev:"GYRO_SWERVE",yaw:+yaw.toFixed(0)}); beep(700,120,p.vol*0.5); } };
    (async()=>{ try{ if(typeof DeviceMotionEvent!=="undefined"&&typeof DeviceMotionEvent.requestPermission==="function") await DeviceMotionEvent.requestPermission(); }catch(e){} window.addEventListener("devicemotion",onMot); })();
    return()=>window.removeEventListener("devicemotion",onMot);
  },[p.gyroOn,p.vol]);

  const startCam=async()=>{
    setErr("");
    try{
      const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:320},height:{ideal:240}},audio:false});
      streamRef.current=s;
      if(videoRef.current){videoRef.current.srcObject=s;await videoRef.current.play().catch(()=>{});}
      setPhase("setzone"); // сначала просим обвести зону руля
    }catch(e){ setErr((e&&e.name?e.name+": ":"")+(e&&e.message||String(e))); setPhase("error"); }
  };
  const stopAll=()=>{cancelAnimationFrame(rafRef.current);clearTimeout(checkTimerRef.current);if(streamRef.current){streamRef.current.getTracks().forEach(t=>t.stop());streamRef.current=null;}};
  useEffect(()=>{startCam();return()=>stopAll();},[]);
  useEffect(()=>{glowRef.current=p.glowMax;setGlowNow(p.glowMax);},[p.glowMax]);
  useEffect(()=>{autoGlowRef.current=p.autoGlow;},[p.autoGlow]);

  // ---- экран настройки зоны: рисуем кадр видео в canvas + рамку поверх ----
  useEffect(()=>{
    if(phase!=="setzone")return;
    let raf;
    const draw=()=>{
      const c=setupRef.current, v=videoRef.current;
      if(c){
        const ctx=c.getContext("2d"),W=c.width,H=c.height;
        if(v&&v.readyState>=2){ ctx.drawImage(v,0,0,W,H); }
        else { ctx.fillStyle="#111";ctx.fillRect(0,0,W,H);ctx.fillStyle="#8a9bb0";ctx.font="14px sans-serif";ctx.textAlign="center";ctx.fillText("камера запускается…",W/2,H/2);ctx.textAlign="left"; }
        const z=drawing||zone;
        if(z){
          const x0=Math.min(z.x0,z.x1)*W,y0=Math.min(z.y0,z.y1)*H,rw=Math.abs(z.x1-z.x0)*W,rh=Math.abs(z.y1-z.y0)*H;
          ctx.fillStyle="rgba(0,0,0,0.5)";
          ctx.fillRect(0,0,W,y0); ctx.fillRect(0,y0+rh,W,H-(y0+rh));
          ctx.fillRect(0,y0,x0,rh); ctx.fillRect(x0+rw,y0,W-(x0+rw),rh);
          ctx.strokeStyle="#00e87a";ctx.lineWidth=3;ctx.strokeRect(x0,y0,rw,rh);
          ctx.fillStyle="#00e87a";ctx.font="bold 14px sans-serif";ctx.fillText("зона руля",x0+6,y0+20);
        }
      }
      raf=requestAnimationFrame(draw);
    };
    raf=requestAnimationFrame(draw);
    return()=>cancelAnimationFrame(raf);
  },[phase,drawing,zone]);
  const evtToNorm=(e,el)=>{const r=el.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)/r.width,y:(t.clientY-r.top)/r.height};};
  const onDown=(e)=>{const pt=evtToNorm(e,setupRef.current);setDrawing({x0:pt.x,y0:pt.y,x1:pt.x,y1:pt.y});};
  const onMove=(e)=>{if(!drawing)return;const pt=evtToNorm(e,setupRef.current);setDrawing(d=>({...d,x1:pt.x,y1:pt.y}));};
  const onUp=()=>{ if(drawing){ const z={x0:Math.min(drawing.x0,drawing.x1),y0:Math.min(drawing.y0,drawing.y1),x1:Math.max(drawing.x0,drawing.x1),y1:Math.max(drawing.y0,drawing.y1)}; if((z.x1-z.x0)>0.05&&(z.y1-z.y0)>0.05){setZone(z);zoneRef.current=z;} setDrawing(null); } };

  const confirmZone=()=>{
    setPhase("live"); lastTsRef.current=Date.now(); armCheck(); loop();
  };
  const resetZone=()=>{setZone(null);zoneRef.current=null;};

  const armCheck=()=>{
    if(!p.checkOn)return;
    clearTimeout(checkTimerRef.current);
    checkTimerRef.current=setTimeout(()=>{ checkArmedRef.current=true; checkDeadlineRef.current=Date.now()+6000; setCheckNow(true); beep(1000,200,p.vol*0.5); },p.checkSec*1000);
  };
  const tapCheck=()=>{
    if(checkArmedRef.current){ checkArmedRef.current=false; setCheckNow(false); armCheck(); if(recRef.current)logRef.current.push({t:Date.now(),ev:"CHECK_OK"}); }
    if(alarm){ setAlarm(false); stageRef.current=0; stillMsRef.current=0; }
  };

  const loop=()=>{
    const v=videoRef.current,raw=rawRef.current;
    if(!v||!raw){rafRef.current=requestAnimationFrame(loop);return;}
    const now=Date.now(); const dt=now-(lastTsRef.current||now); lastTsRef.current=now;
    if(v.readyState>=2){
      const rc=raw.getContext("2d",{willReadFrequently:true});
      rc.drawImage(v,0,0,AW,AH);
      let img=null;try{img=rc.getImageData(0,0,AW,AH);}catch(e){}
      // границы зоны (в пикселях анализа)
      const z=zoneRef.current;
      const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
      const zx0=clamp(z?Math.floor(z.x0*AW):0,0,AW-1), zy0=clamp(z?Math.floor(z.y0*AH):0,0,AH-1);
      const zx1=clamp(z?Math.ceil(z.x1*AW):AW,zx0+1,AW), zy1=clamp(z?Math.ceil(z.y1*AH):AH,zy0+1,AH);
      const zoneArea=Math.max(1,(zx1-zx0)*(zy1-zy0));
      // первый проход: собрать яркости зоны, найти среднее и максимум
      const lums=[];
      if(img){
        const d=img.data;
        for(let y=zy0;y<zy1;y++)for(let x=zx0;x<zx1;x++){
          const i=(y*AW+x)*4; lums.push(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114);
        }
      }
      let mean=0,mx=0;
      if(lums.length){ let s=0; for(const l of lums){s+=l; if(l>mx)mx=l;} mean=s/lums.length; }
      // УМНЫЙ ПОРОГ: метка = заметно светлее фона зоны (важен КОНТРАСТ, не абсолют).
      let dynTh = mean + (mx-mean)*0.5;
      dynTh = Math.max(mean+10, dynTh);           // минимум на 10 выше фона
      dynTh = Math.min(dynTh, mx-2);              // но ниже самого яркого, чтобы метка попадала
      if(!isFinite(dynTh)) dynTh = 150;           // страховка от NaN/пустой зоны
      thrRef.current = thrRef.current*0.6 + dynTh*0.4;
      if(!isFinite(thrRef.current)) thrRef.current = 150;
      setAutoThr(Math.round(thrRef.current));
      // второй проход: считаем метку по этому порогу
      let n=0,sumX=0;
      if(img){
        const d=img.data;
        for(let y=zy0;y<zy1;y++)for(let x=zx0;x<zx1;x++){
          const i=(y*AW+x)*4; const lum=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;
          if(lum>=thrRef.current){n++;sumX+=x;}
        }
      }
      const frac=n/zoneArea;
      // метка "хорошая": есть контрастное пятно, но не пол-зоны (иначе засветка).
      // и сам контраст должен быть заметным (max заметно выше среднего).
      const contrast=mx-mean;
      const good=(n>=1 && frac<0.5 && contrast>8);
      setSeeMark(good);

      if(autoGlowRef.current){
        let g=glowRef.current;
        if(!good) g=Math.min(p.glowMax, g+0.03); else g=Math.max(p.glowMax*0.5, g-0.02);
        glowRef.current=g; setGlowNow(g);
      }
      let normX=lastXRef.current==null?0.5:lastXRef.current;
      if(good)normX=(sumX/n - zx0)/Math.max(1,(zx1-zx0));
      const mv=(lastXRef.current==null)?0:Math.abs(normX-lastXRef.current);
      lastXRef.current=normX;

      const moving=mv>0.012;
      // ВАЖНО: тревожим ТОЛЬКО когда метка реально видна. Нет метки -> молчим, копим не наказываем.
      if(good){
        if(moving){ stillMsRef.current=0; if(stageRef.current>0){stageRef.current=0;setAlarm(false);} }
        else{ stillMsRef.current+=dt; }
        const ss=stillMsRef.current/1000;
        if(ss>=p.holdSec && stageRef.current<1){ stageRef.current=1; beep(900,160,p.vol*0.5); if(recRef.current)logRef.current.push({t:now,ev:"BEEP1"}); }
        if(ss>=p.holdSec+2 && stageRef.current<2){ stageRef.current=2; beep(1100,150,p.vol*0.6); setTimeout(()=>beep(1100,150,p.vol*0.6),200); if(recRef.current)logRef.current.push({t:now,ev:"TUKTUK"}); }
        if(ss>=p.holdSec+4 && stageRef.current<3){ stageRef.current=3; setAlarm(true); siren(6,p.vol); if(recRef.current)logRef.current.push({t:now,ev:"ALARM"}); }
      }else{
        // метки нет — сбрасываем накопление, НЕ пищим
        stillMsRef.current=0; if(stageRef.current>0){stageRef.current=0;setAlarm(false);}
      }

      if(checkArmedRef.current && Date.now()>checkDeadlineRef.current && !alarm){ setAlarm(true); siren(6,p.vol); if(recRef.current)logRef.current.push({t:now,ev:"CHECK_MISS"}); }

      const view=viewRef.current;
      if(hud && view){
        const vc=view.getContext("2d"),VW=view.width,VH=view.height;
        vc.drawImage(v,0,0,VW,VH);
        // рамка зоны
        if(z){ vc.strokeStyle="rgba(0,232,122,0.7)";vc.lineWidth=2;vc.strokeRect(z.x0*VW,z.y0*VH,(z.x1-z.x0)*VW,(z.y1-z.y0)*VH); }
        if(img && good){
          vc.fillStyle="rgba(0,232,255,0.5)";const sx=VW/AW,sy=VH/AH,d=img.data;
          for(let y=zy0;y<zy1;y++)for(let x=zx0;x<zx1;x++){const i=(y*AW+x)*4;const lum=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114;if(lum>=thrRef.current){vc.fillRect(x*sx,y*sy,sx,sy);}}
          const gx=(zx0+(sumX/n-zx0));
          vc.strokeStyle="#ff6b35";vc.lineWidth=3;vc.beginPath();vc.moveTo((sumX/n/AW)*VW,z.y0*VH);vc.lineTo((sumX/n/AW)*VW,z.y1*VH);vc.stroke();
        }
      }

      if(recRef.current){ logRef.current.push({t:now,x:+normX.toFixed(4),mv:+mv.toFixed(4),n,frac:+frac.toFixed(3),thr:Math.round(thrRef.current),stage:stageRef.current,good:good?1:0}); setRecN(logRef.current.length); }
    }
    rafRef.current=requestAnimationFrame(()=>setTimeout(loop,110));
  };

  const toggleRec=()=>{ recRef.current=!recRef.current; if(recRef.current){logRef.current=[];setRecN(0);} };
  const downloadShots=()=>{
    shotsRef.current.forEach((s,i)=>{
      setTimeout(()=>{
        const a=document.createElement("a"); a.href=s.dataUrl;
        a.download="antison_shot_"+String(i+1).padStart(2,"0")+"_"+s.code.replace(/[^a-zA-Z0-9-]/g,"_")+".jpg";
        document.body.appendChild(a);a.click();setTimeout(()=>document.body.removeChild(a),300);
      }, i*500);
    });
  };
  const download=()=>{
    const out={meta:{app:"Antison",ver:VER,ts:new Date().toISOString(),ua:navigator.userAgent,holdSec:p.holdSec,sens:p.sens,glowColor:p.glowColor,zone:zoneRef.current,samples:logRef.current.length},rows:logRef.current};
    const blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
    const url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download="antison_"+new Date().toISOString().replace(/[:.]/g,"-")+".json";
    document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);
  };

  const rgb=glowRGB(p.glowColor);

  return (
   <React.Fragment>
    <video ref={videoRef} playsInline muted autoPlay style={{display:"none"}}/>
    <canvas ref={rawRef} width={AW} height={AH} style={{display:"none"}}/>

    {phase==="error"&&(
    <div style={{height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"24px",textAlign:"center"}}>
      <div style={{color:"#ff6666",fontSize:"15px",marginBottom:"10px"}}>Камера не открылась</div>
      <div className="mono" style={{fontSize:"12px",color:"#8a9bb0",marginBottom:"16px"}}>{err}</div>
      <button onClick={()=>p.setScreen("home")} style={{padding:"12px 20px",borderRadius:"12px",border:"1px solid #4a9eff",background:"rgba(74,158,255,0.12)",color:"#9fcfff"}}>Назад</button>
    </div>
    )}

    {/* ---- экран обводки зоны ---- */}
    {phase==="setzone"&&(
    <div style={{height:"100%",background:"#000",display:"flex",flexDirection:"column",padding:"12px",justifyContent:"center"}}>
      <div style={{fontSize:"15px",color:"#fff",fontWeight:700,marginBottom:"8px",textAlign:"center"}}>Обведи пальцем зону руля</div>
      <div style={{fontSize:"12px",color:"#8a9bb0",marginBottom:"10px",textAlign:"center"}}>Проведи пальцем прямоугольник вокруг руля / метки. Камера будет смотреть только туда.</div>
      <canvas ref={setupRef} width={320} height={240}
        onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}
        onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp}
        style={{width:"100%",aspectRatio:"4 / 3",borderRadius:"12px",border:"1px solid rgba(74,158,255,0.3)",background:"#000",touchAction:"none",display:"block"}}/>
      <div style={{display:"flex",gap:"8px",marginTop:"12px"}}>
        <button onClick={resetZone} style={{flex:1,padding:"14px",borderRadius:"12px",border:"1px solid rgba(255,255,255,0.2)",background:"rgba(20,24,34,0.85)",color:"#c0c8d4",fontSize:"15px",fontWeight:700}}>↺ Заново</button>
        <button onClick={confirmZone} disabled={!zone} style={{flex:2,padding:"14px",borderRadius:"12px",border:"1px solid #00e87a",background:zone?"linear-gradient(135deg,#0f401b,#1c6e32)":"rgba(20,24,34,0.5)",color:zone?"#8cffbe":"#556",fontSize:"16px",fontWeight:800}}>✓ Готово, начать</button>
      </div>
    </div>
    )}

    {phase==="live"&&(
    <div style={{height:"100%",position:"relative",background:"#000",overflow:"hidden"}} onClick={()=>{if(!hud)tapCheck();}}>

      <div style={{position:"absolute",top:12,left:14,zIndex:5}}>
        <div className="mono" style={{fontSize:"20px",fontWeight:900,color:"#fff"}}>АНТИСОН {VER}</div>
        <div style={{fontSize:"17px",fontWeight:800,color:seeMark?"#00e87a":"#ffb84a",marginTop:"3px"}}>{seeMark?"✓ метку вижу":"⋯ ищу метку"}</div>
      </div>
      <div style={{position:"absolute",top:12,right:14,zIndex:5,textAlign:"right"}}>
        <div className="mono" style={{fontSize:"22px",fontWeight:800,color:"#f0f4f8"}}>{spd!=null?spd:"--"}<span style={{fontSize:"11px",color:"#8a9bb0"}}> mph</span></div>
        <div className="mono" style={{fontSize:"13px",color:"#8a9bb0"}}>{clock}</div>
      </div>

      {hud?(
        <div style={{position:"absolute",top:"60px",left:"12px",right:"12px",zIndex:4}}>
          <canvas ref={viewRef} width={320} height={240} style={{width:"100%",aspectRatio:"4 / 3",borderRadius:"12px",border:"1px solid rgba(74,158,255,0.3)",display:"block",background:"#000"}}/>
          <div className="mono" style={{fontSize:"15px",color:"#a8b4c4",marginTop:"8px",textAlign:"center"}}>порог:{autoThr} · свет:{Math.round(glowNow*100)}% · лог:{recN}</div>
        </div>
      ):(
        <div style={{position:"absolute",top:0,left:0,right:0,bottom:"33%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:2}}>
          <div style={{fontSize:"16px",color:seeMark?"#00e87a":"#ffb84a",fontWeight:700}}>{seeMark?"✓ под контролем":"⋯ ищу метку на руле"}</div>
          <div style={{fontSize:"12px",color:"#445",marginTop:"8px"}}>тапни экран, если попросит</div>
        </div>
      )}

      {checkNow&&!alarm&&(
        <div onClick={(e)=>{e.stopPropagation();tapCheck();}} style={{position:"absolute",inset:0,zIndex:20,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(0,0,0,0.4)"}}>
          <div style={{width:"210px",height:"210px",borderRadius:"50%",background:"rgba(74,158,255,0.25)",border:"3px solid #4a9eff",display:"flex",alignItems:"center",justifyContent:"center",color:"#9fcfff",fontSize:"22px",fontWeight:800,textAlign:"center"}}>ТАПНИ<br/>живой?</div>
        </div>
      )}

      {alarm&&(
        <div onClick={(e)=>{e.stopPropagation();tapCheck();}} style={{position:"absolute",inset:0,zIndex:30,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"rgba(150,0,0,0.9)"}}>
          <div style={{fontSize:"44px",fontWeight:900,color:"#fff",marginBottom:"10px"}}>⚠ ПРОСНИСЬ</div>
          <div style={{fontSize:"18px",color:"#ffd0d0",marginBottom:"26px"}}>тапни, чтобы отключить</div>
          <div style={{width:"230px",height:"230px",borderRadius:"50%",background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",color:"#a00",fontSize:"30px",fontWeight:900}}>СТОП</div>
        </div>
      )}

      {/* КРУПНАЯ подсветка снизу: до 33% высоты, ярко у низа, плавно гаснет */}
      <div style={{position:"absolute",left:0,right:0,bottom:0,height:"33%",pointerEvents:"none",zIndex:1,
        background:`linear-gradient(0deg, rgba(${rgb},${Math.min(1,glowNow*1.3)}) 0%, rgba(${rgb},${glowNow*0.8}) 40%, rgba(${rgb},${glowNow*0.3}) 75%, rgba(${rgb},0) 100%)`}}/>

      <div style={{position:"absolute",bottom:0,left:0,right:0,zIndex:6,padding:"10px 12px 16px",display:"flex",gap:"8px"}}>
        <button onClick={(e)=>{e.stopPropagation();setHud(!hud);}} style={{flex:1,padding:"12px",borderRadius:"12px",fontSize:"13px",fontWeight:700,border:"1px solid rgba(255,255,255,0.2)",background:"rgba(20,24,34,0.9)",color:"#c0c8d4"}}>{hud?"🌙 Спрятать":"👁 Показать"}</button>
        <button onClick={(e)=>{e.stopPropagation();setShowSet(true);}} style={{flex:1,padding:"12px",borderRadius:"12px",fontSize:"13px",fontWeight:700,border:"1px solid rgba(255,255,255,0.2)",background:"rgba(20,24,34,0.9)",color:"#c0c8d4"}}>⚙ Настр.</button>
        <button onClick={(e)=>{e.stopPropagation();download();}} style={{flex:1,padding:"12px",borderRadius:"12px",fontSize:"13px",fontWeight:700,border:"1px solid rgba(255,255,255,0.2)",background:"rgba(20,24,34,0.9)",color:"#c0c8d4"}}>⬇ Лог</button>
        <button onClick={(e)=>{e.stopPropagation();stopAll();p.setScreen("home");}} style={{flex:1,padding:"12px",borderRadius:"12px",fontSize:"13px",fontWeight:700,border:"1px solid #ff4444",background:"rgba(255,68,68,0.15)",color:"#ff8888"}}>■ Стоп</button>
      </div>
    </div>
    )}
    {showSet&&(
      <div style={{position:"absolute",inset:0,zIndex:50,background:"#0a0d14",overflowY:"auto"}}>
        <Settings glowColor={p.glowColor} setGlowColor={p.setGlowColor} glowMax={p.glowMax} setGlowMax={p.setGlowMax}
          autoGlow={p.autoGlow} setAutoGlow={p.setAutoGlow} holdSec={p.holdSec} setHoldSec={p.setHoldSec}
          sens={p.sens} setSens={p.setSens} gyroOn={p.gyroOn} setGyroOn={p.setGyroOn}
          checkOn={p.checkOn} setCheckOn={p.setCheckOn} checkSec={p.checkSec} setCheckSec={p.setCheckSec}
          vol={p.vol} setVol={p.setVol} showCam={p.showCam} setShowCam={(v)=>{p.setShowCam(v);setHud(v);}}
          setScreen={()=>setShowSet(false)}/>
      </div>
    )}
   </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
